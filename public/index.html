<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLUgranja</title>
<meta name="theme-color" content="#0c2a43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PLUgranja">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.png">
<style>
:root{--n:#0c2a43;--n2:#173d5e;--nl:#e7eef5;--bg:#f3f5f8;--tx:#13212e;--mu:#667585;--bd:#dbe2ea;--red:#c62828;--grn:#2e7d32;--org:#ef6c00;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);min-height:44px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--n)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--n2);border-color:transparent}
label.l{display:block;font-size:13px;font-weight:600;color:var(--mu);margin:0 0 5px}
.hidden{display:none!important}
.f{margin-bottom:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--n);color:#fff;padding:12px 16px;border-radius:10px;font-weight:600;min-height:44px}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.5}
.btn.w{width:100%}.btn.sec{background:var(--nl);color:var(--n)}.btn.red{background:#fdecea;color:var(--red)}.btn.ok{background:var(--grn)}
.btn.sm{padding:7px 11px;font-size:14px;min-height:36px}
.err{color:var(--red);font-size:14px;margin:4px 0 10px;min-height:18px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--n)}
.lbox{background:#fff;border-radius:18px;padding:30px 24px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.lbox img{display:block;width:220px;max-width:80%;margin:0 auto 6px}
.appname{text-align:center;font-weight:800;color:var(--n);font-size:22px;letter-spacing:.5px;margin-bottom:22px}
.langsw{display:flex;gap:6px;justify-content:center;margin-top:16px}
.langsw button{padding:6px 12px;border-radius:8px;color:var(--mu);font-weight:600}.langsw button.on{background:var(--nl);color:var(--n)}
/* layout */
#app{display:flex;min-height:100vh}
nav{background:var(--n);color:#fff;width:236px;flex-shrink:0;display:flex;flex-direction:column;padding:20px 12px;position:sticky;top:0;height:100vh}
nav .brand{padding:0 8px 22px}nav .brand img{width:150px;display:block}nav .brand div{font-weight:700;letter-spacing:.5px;margin-top:6px;color:#b9cde0;font-size:14px}
.nb{display:flex;align-items:center;gap:12px;color:#c3d3e2;padding:12px;border-radius:10px;width:100%;text-align:left;font-weight:500}
.nb.on{background:rgba(255,255,255,.14);color:#fff}.nb .ic{font-size:20px;width:24px;text-align:center}
.who{margin-top:auto;padding:12px 8px;font-size:13px;color:#b9cde0;border-top:1px solid rgba(255,255,255,.15)}.who b{color:#fff;display:block;font-size:15px}
.who .row{margin-top:10px}.who .btn{background:rgba(255,255,255,.14);color:#fff}
main{flex:1;padding:26px;max-width:1100px;width:100%;min-width:0}
header.top{display:none}
h1{font-size:24px;margin-bottom:16px;color:var(--n)}h2{font-size:17px;margin-bottom:12px;color:var(--n)}h3{font-size:15px;margin-bottom:8px}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:16px;border:1px solid var(--bd)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.grow{flex:1;min-width:130px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px}.kpi .v{font-size:24px;font-weight:700;color:var(--n)}.kpi .k{font-size:12px;color:var(--mu)}
.kpi.hl{background:var(--n);border-color:var(--n)}.kpi.hl .v,.kpi.hl .k{color:#fff}
.tabs{display:flex;gap:6px;background:#e3e9ef;padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:9px;font-weight:600;color:var(--mu)}.tabs button.on{background:#fff;color:var(--n);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th.tl,td.tl{text-align:left}tr.click{cursor:pointer}tr.click:hover{background:#f7f9fb}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;background:var(--nl);color:var(--n)}
.tag.lock{background:#e8f5e9;color:var(--grn)}.tag.pend{background:#fff3e0;color:var(--org)}.tag.ret{background:#fdecea;color:var(--red)}
.empty{color:var(--mu);text-align:center;padding:26px}
.muted{color:var(--mu);font-size:13px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:200;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(8,20,32,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.modal>.card{width:100%;max-width:560px;border-radius:18px 18px 0 0;margin:0;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.spin{width:38px;height:38px;border:4px solid var(--nl);border-top-color:var(--n);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}@keyframes sp{to{transform:rotate(360deg)}}
.loading{text-align:center;color:var(--mu);padding:30px}
/* escorxador open card */
.open{border:2px solid var(--n);}
.wk{font-size:13px;font-weight:700;color:#fff;background:var(--n);border-radius:8px;padding:4px 10px;display:inline-block}
/* hidrolisi */
.conts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cont{border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:#fff;display:flex;flex-direction:column}
.cont .hd{padding:16px 14px;color:#fff;text-align:center}
.cont .code{font-size:30px;font-weight:800;letter-spacing:1px;line-height:1.1;word-break:break-all}
.cont .stt{font-size:13px;font-weight:600;opacity:.95;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.cont .bd{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
.s-buit{background:#78909c}.s-ini{background:var(--grn)}.s-tanc{background:var(--org)}.s-buid{background:var(--red)}
.b-ini{background:var(--grn)}.b-tanc{background:var(--org)}.b-buid{background:var(--red)}
.steps{display:flex;gap:4px;justify-content:center;margin-top:8px}.steps i{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}.steps i.on{background:#fff}
/* granges */
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--nl);color:var(--n);border-radius:20px;padding:5px 6px 5px 12px;font-size:14px;font-weight:600}.chip button{width:24px;height:24px;border-radius:50%;color:var(--mu)}
.chk{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bigin{font-size:26px;font-weight:700;text-align:center;min-height:60px;color:var(--n)}.big3 .l,.big2 .l{text-align:center;min-height:32px;display:flex;align-items:flex-end;justify-content:center}
.alert{display:flex;gap:12px;align-items:center;background:#fff3e0;border:2px solid var(--org);color:#7a3d00;border-radius:12px;padding:12px 14px;margin-bottom:16px;cursor:pointer}
.badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--org);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;padding:0 5px;margin-left:auto}
.nb{position:relative}@media(max-width:800px){.nb .badge{position:absolute;top:2px;right:calc(50% - 22px);margin:0}}
.steps-box{background:var(--nl);border-radius:10px;padding:12px 14px;line-height:1.9;font-size:15px}
.fx{width:22px;height:22px}
.photo{width:100%;border-radius:10px;border:1px solid var(--bd);background:#f0f0f0;min-height:120px;display:block}
.sel{width:auto;min-height:36px;padding:6px 8px;font-size:14px}
@media(min-width:801px){.modal{align-items:center}.modal>.card{border-radius:18px}}
@media(max-width:800px){
 #app{flex-direction:column}
 header.top{display:flex;justify-content:space-between;align-items:center;background:var(--n);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;position:sticky;top:0;z-index:30}
 header.top img{height:30px}header.top .btn{background:rgba(255,255,255,.14);color:#fff}
 nav{position:fixed;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;padding:5px 2px calc(5px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around;top:auto}
 nav .brand,nav .who{display:none}
 .nb{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;text-align:center;flex:1;justify-content:center}
 main{padding:14px 12px 100px}h1{font-size:21px}
 table.rt tr:first-child{display:none}table.rt tr{display:flex;flex-wrap:wrap;gap:4px 16px;padding:11px 2px;border-bottom:1px solid var(--bd);align-items:center}
 table.rt td{border:0;padding:0;text-align:left;white-space:normal;font-size:15px}table.rt td[data-l]::before{content:attr(data-l)': ';color:var(--mu);font-size:12px}
 table.rt td:first-child{width:100%;font-size:16px}table.rt td:first-child::before,table.rt td:last-child::before{display:none}table.rt td:last-child{margin-left:auto}
 .conts{grid-template-columns:1fr 1fr}.cont .code{font-size:24px}
}
#splash{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 30% 20%,#1d4f7c 0%,#0c2a43 45%,#06151f 100%);transition:opacity .6s ease,transform .6s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash svg{width:min(72vw,420px);overflow:visible}
#splash .lg{fill:#fff;fill-opacity:0;stroke:#fff;stroke-width:2.2;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.6,0,.3,1) forwards,fill .7s ease 1.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fill{to{fill-opacity:1;stroke-opacity:0}}
#splash .nm{margin-top:28px;color:#fff;font-size:26px;font-weight:800;letter-spacing:6px;opacity:0;transform:translateY(10px);animation:up .6s ease 1.5s forwards}#splash .nm b{color:#7cc4ff;font-weight:400;letter-spacing:4px}
#splash .bar{margin-top:26px;width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;opacity:0;animation:up .5s ease 1.7s forwards}
#splash .bar i{display:block;width:40%;height:100%;border-radius:3px;background:#7cc4ff;animation:ld 1.1s ease-in-out infinite}
#splash .ft{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));color:rgba(255,255,255,.45);font-size:11px;letter-spacing:3px;opacity:0;animation:up .6s ease 1.7s forwards}
@keyframes up{to{opacity:1;transform:none}}@keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}

.stack{display:grid;gap:12px}.stack .l{text-align:left}
.bxbox{margin-top:16px;padding-top:14px;border-top:1px dashed var(--bd)}
.bxl{display:grid;gap:6px;margin-top:8px}.bx{display:flex;align-items:center;gap:10px;background:#fdf3f2;border-radius:10px;padding:6px 8px}
.bxn{min-width:40px;height:40px;border-radius:10px;background:var(--red);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1.1em}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;gap:10px;align-items:stretch}.stepper .btn{font-size:32px;font-weight:700;min-height:72px}.stepper .bigin{min-height:72px}
.causes{display:flex;flex-wrap:wrap;gap:8px}.causes .btn{min-height:44px;font-weight:600}.causes .btn.on{background:var(--n);color:#fff}
body.gr .stepper{grid-template-columns:84px 1fr 84px}body.gr .stepper .btn,body.gr .stepper .bigin{min-height:88px}body.gr .causes .btn{min-height:56px;font-size:20px}body.gr .bxn{min-width:48px;height:48px}
.fchips{display:flex;flex-wrap:wrap;gap:8px}.fchip{border:2px solid var(--bd);background:#fff;border-radius:20px;padding:7px 14px;font-weight:600;color:var(--mu);min-height:40px}.fchip.on{background:var(--n);border-color:var(--n);color:#fff}
.selbar{position:sticky;top:8px;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--n);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px;box-shadow:0 6px 18px rgba(0,0,0,.2)}.selbar .btn.sec{background:rgba(255,255,255,.15);color:#fff}
/* ---- mode granger ---- */
body.gr{font-size:21px}
body.gr nav{display:none!important}
body.gr header.top{display:flex;justify-content:space-between;align-items:center;background:var(--n);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:30}
body.gr header.top img{height:36px}body.gr header.top .btn{background:rgba(255,255,255,.14);color:#fff;min-height:50px;font-size:19px}
body.gr #app{flex-direction:column}
body.gr main{max-width:680px;margin:0 auto;padding:18px 16px 50px}
body.gr h1{font-size:33px;margin:6px 0 18px}body.gr h2{font-size:26px}body.gr h3{font-size:22px}
body.gr .btn{min-height:64px;font-size:22px;border-radius:14px;padding:14px 18px}
body.gr .btn.sm{min-height:54px;font-size:20px;padding:10px 16px}
body.gr input,body.gr select,body.gr textarea{min-height:64px;font-size:23px;border-radius:12px;border-width:2px}
body.gr label.l{font-size:20px;color:var(--tx)}
body.gr .muted{font-size:19px}body.gr .tag{font-size:19px;padding:6px 12px}
body.gr .bigin{font-size:42px;min-height:88px}
body.gr .kpi .v{font-size:36px}body.gr .kpi .k{font-size:19px}
body.gr .wk{font-size:20px;padding:7px 14px}
body.gr table.rt td{font-size:21px}body.gr th,body.gr td{font-size:20px}body.gr table.rt td[data-l]::before{font-size:17px}
body.gr .card{padding:20px;border-radius:16px}
body.gr .tabs{display:none}
body.gr .cont .code{font-size:40px}body.gr .cont .stt{font-size:19px}body.gr .conts{grid-template-columns:1fr}
body.gr .toast{font-size:21px;padding:14px 22px;bottom:30px}
body.gr .alert{font-size:21px}body.gr .modal>.card{font-size:21px}body.gr .big3{grid-template-columns:1fr;gap:14px}body.gr .big3 .l{justify-content:flex-start;min-height:0}
.hello{font-size:23px;color:var(--mu);margin-top:4px}
.tiles{display:grid;gap:14px;margin-bottom:22px}
.tile{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--bd);border-radius:18px;padding:18px 16px;text-align:left;width:100%;min-height:100px;box-shadow:0 2px 6px rgba(12,42,67,.06)}
.tile:active{transform:scale(.98);background:var(--nl)}
.tile .ti{font-size:48px;width:62px;text-align:center;flex-shrink:0}
.tile .tt{display:block;font-size:29px;font-weight:800;color:var(--n);line-height:1.2}
.tile .ts{display:block;font-size:20px;margin-top:5px;color:var(--mu)}
.tile .ts.warn{color:#b45309;font-weight:700}.tile .ts.ok{color:var(--grn);font-weight:700}
.tile.warn{border-color:var(--org);background:#fff8ef}
.tile .arr{margin-left:auto;font-size:36px;color:var(--mu);padding-left:6px}
.backbtn{margin-bottom:14px;justify-content:flex-start;font-size:23px!important}
.grfoot{display:grid;gap:12px;margin-top:30px;padding-top:20px;border-top:2px solid var(--bd)}
</style>
</head>

async function api(action,data={}){
 let r;try{r=await fetch('/api',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+TOKEN},body:JSON.stringify({action,...data})})}catch(e){throw new Error('net')}
 const j=await r.json().catch(()=>({error:'server'}));
 if(r.status===401&&action!=='login'&&action!=='pin.change'){logout();throw new Error('auth')}
 if(j.error)throw new Error(j.error);return j}
function errMsg(e){return t('e_'+e.message)!=='e_'+e.message?t('e_'+e.message):e.message}
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2300)}

const fmtE=n=>n==null?'':Number(n).toLocaleString(lang==='ca'?'ca-ES':'es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const fmtDT=s=>{if(!s)return'';const d=new Date(s);return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})};
const fmtD=s=>s?s.split('-').reverse().join('/'):'';
function isoWeek(d=new Date()){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);const y=x.getUTCFullYear();return{y,w:Math.ceil(((x-new Date(Date.UTC(y,0,1)))/864e5+1)/7)}}
function weekRange(y,w){const s=new Date(Date.UTC(y,0,4));const d=s.getUTCDay()||7;s.setUTCDate(s.getUTCDate()-d+1+(w-1)*7);const e=new Date(s);e.setUTCDate(s.getUTCDate()+6);const f=x=>String(x.getUTCDate()).padStart(2,'0')+'/'+String(x.getUTCMonth()+1).padStart(2,'0');return f(s)+'–'+f(e)}
function csv(rows,name){const s='﻿'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download=name+'_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

async function doLogin(){$('lErr').textContent='';$('lBtn').disabled=true;
 try{const login=$('lUser').value.trim();const r=await api('login',{login,pin:$('lPin').value});TOKEN=r.token;try{localStorage.setItem('plug_tok',TOKEN);localStorage.setItem('plug_last',login)}catch(e){}$('lPin').value='';await start()}
 catch(e){$('lErr').textContent=errMsg(e)}finally{$('lBtn').disabled=false}}

async function start(){
 B=await api('boot');for(const k in D)D[k]=null;
 $('login').classList.add('hidden');$('app').classList.remove('hidden');
 if(!MODS.find(m=>m.id===VIEW&&m.ok()))VIEW=(MODS.find(m=>m.ok())||{}).id||'';

 if(isGr()){GF=null;GV=null;try{history.replaceState({gr:1,gf:null,gv:null},'')}catch(e){}}
 render();setTimeout(aiguaPopup,3000)}

 return `<div class="bxl">${[...L].reverse().map(b=>`<div class="bx"><span class="bxn">${b.n}</span><span class="grow">${b.data?fmtD(b.data).slice(0,5):''}${b.motiu?` · ${esc(t('m_'+b.motiu))}`:''}${b.byName?` <span class="muted">${esc(b.byName)}</span>`:''}</span>${canDel&&b.by!==''?`<button class="btn sm red" onclick="delBaixa('${r.id}','${b.id}')" aria-label="${t('del')}">✕</button>`:''}</div>`).join('')}</div>`}

async function saveEsc(id,farm,year,week,silent){
 const k=id||farm;const fem=$('ef_'+k).value,masc=$('em_'+k).value;
 if(!silent&&(fem===''||masc==='')){toast(t('fill'));return}
 const r=await run(()=>api('escorxador.save',{rec:{id:id||undefined,farm,year,week,fem,masc}}),silent?null:(P().validar?t('saved'):t('waitVal')));
 if(!silent)refresh('escorxador');return r.rec}

function compress(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const M=1600;let{width:w,height:h}=img;if(Math.max(w,h)>M){const s=M/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.82).split(',')[1])};img.onerror=rej;img.src=URL.createObjectURL(file)})}

 <div class="f"><label class="l">${t('naus')}</label><div class="chips" id="chN"></div><div class="row" style="margin-top:6px;flex-wrap:nowrap"><input id="nNau" placeholder="Nau 1"><button class="btn sm" onclick="addChip('naus','name','nNau')">${t('add')}</button></div></div>
 <div class="f"><label class="l">${t('conts')} (${t('hidrolisi')})</label><div class="chips" id="chC"></div><div class="row" style="margin-top:6px;flex-wrap:nowrap"><input id="nCont" placeholder="C-01"><button class="btn sm" onclick="addChip('conts','code','nCont')">${t('add')}</button></div></div>
 <div class="f"><label class="l">${t('meters')}</label><div class="chips" id="chM"></div><div class="row" style="margin-top:6px;flex-wrap:nowrap"><input id="nMet" placeholder="${t('meter')} 1"><button class="btn sm" onclick="addChip('meters','code','nMet')">${t('add')}</button></div></div>
 <div class="err" id="mErr"></div><button class="btn w" onclick="saveFarm('${id||''}')">${t('save')}</button>
 <div class="row" style="margin-top:10px;flex-wrap:nowrap"><button class="btn sec grow" onclick="closeModal()">${t('cancel')}</button>${id&&isAdmin()?`<button class="btn red grow" onclick="delFarm('${id}')">${t('del')}</button>`:''}</div>`);drawChips()}
function drawChips(){$('chN').innerHTML=FT.naus.map((n,i)=>`<span class="chip">${esc(n.name)}<button onclick="FT.naus.splice(${i},1);drawChips()">✕</button></span>`).join('');$('chC').innerHTML=FT.conts.map((n,i)=>`<span class="chip">${esc(n.code)}<button onclick="if(confirm('${t('confirmDel')}')){FT.conts.splice(${i},1);drawChips()}">✕</button></span>`).join('');$('chM').innerHTML=FT.meters.map((n,i)=>`<span class="chip">${esc(n.code)}<button onclick="if(confirm('${t('confirmDel')}')){FT.meters.splice(${i},1);drawChips()}">✕</button></span>`).join('')}
function addChip(k,f,inp){const v=$(inp).value.trim();if(!v)return;FT[k].push({id:'',[f]:v});$(inp).value='';drawChips();$(inp).focus()}
['keydown'].forEach(()=>document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='nNau'||e.target.id==='nCont'||e.target.id==='nMet')){e.preventDefault();e.target.nextElementSibling.click()}}));
async function saveFarm(id){const rec={id:id||undefined,ref:$('fRef').value,name:$('fName').value,rega:$('fRega').value,marca:$('fMarca').value,address:$('fAddr').value,own:$('fOwn').checked,naus:FT.naus,conts:FT.conts,meters:FT.meters};
 if(!rec.name.trim()){$('mErr').textContent=t('fill');return}
 try{await api('farms.save',{rec});closeModal();toast(t('saved'));await start()}catch(e){$('mErr').textContent=errMsg(e)}}
async function delFarm(id){if(!confirm(t('confirmDel')))return;try{await api('farms.delete',{id});closeModal();toast(t('deleted'));await start()}catch(e){$('mErr').textContent=errMsg(e)}}

/* ================= CONFIGURACIÓ ================= */
const ROLES=['admin','enginyer','vetlog','vet','granger'];const PM=['destete','escorxador','gastos','hidrolisi','aigua','granges'];const PF=['validar','retornar','exportar','tancaExport','gestHidro','validarGastos'];const FUNCS=['destete','escorxador','gastos','hidrolisi','aigua'];
async function vConfig(){
 const ap=B.allPerms;
 $('main').innerHTML=`<h1>⚙️ ${t('config')}</h1>
 <div class="card"><div class="row sp" style="margin-bottom:6px"><h2 style="margin:0">${t('users')}</h2><button class="btn sm" onclick="userForm()">＋ ${t('newUser')}</button></div>
 <div class="tw"><table><tr><th class="tl">${t('name')}</th><th class="tl">${t('login')}</th><th class="tl">${t('role')}</th><th class="tl">${t('farms')}</th></tr>
 ${B.users.map(u=>`<tr class="click" onclick="userForm('${u.id}')"><td class="tl"><b>${esc(u.name)}</b></td><td class="tl">${esc(u.login)}</td><td class="tl"><span class="tag">${t(u.role)}</span></td><td class="tl" style="white-space:normal">${u.farms.length?u.farms.map(id=>esc(farmName(id))).join(', '):(u.role==='granger'?'—':t('allF'))}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>${t('perms')}</h2><div class="tw"><table class="nort"><tr><th class="tl">${t('role')}</th>${PM.map(m=>`<th>${t(m)}</th>`).join('')}${PF.map(f=>`<th style="white-space:normal;min-width:80px">${t(f)}</th>`).join('')}</tr>
 ${ROLES.map(r=>`<tr><td class="tl"><b>${t(r)}</b></td>${PM.map(m=>`<td><select class="sel pm" data-r="${r}" data-m="${m}" ${r==='admin'?'disabled':''}>${[0,1,2].map(l=>`<option value="${l}" ${ap[r][m]===l?'selected':''}>${t('lvl'+l)}</option>`).join('')}</select></td>`).join('')}${PF.map(f=>`<td style="text-align:center"><input type="checkbox" class="pf" data-r="${r}" data-f="${f}" ${ap[r][f]?'checked':''} ${r==='admin'?'disabled':''}></td>`).join('')}</tr>`).join('')}</table></div>
 <button class="btn" style="margin-top:12px" onclick="savePerms()">${t('save')}</button></div>
 <div class="card"><h2>${t('funcsFarm')}</h2><div class="muted" style="margin-bottom:10px">${t('funcsHint')}</div><div class="tw"><table class="nort"><tr><th class="tl">${t('farm')}</th>${FUNCS.map(m=>`<th>${t(m)}</th>`).join('')}</tr>
 <tr><td class="tl muted">${t('quick')}</td>${FUNCS.map(m=>`<td><select class="sel" onchange="quickFuncs('${m}',this.value);this.value=''"><option value=""></option>${['all','own','notown','none'].map(v=>`<option value="${v}">${t('q_'+v)}</option>`).join('')}</select></td>`).join('')}</tr>
 ${(B.allFarms||[]).map(f=>`<tr><td class="tl"><b>${esc(f.name)}</b> ${f.own?`<span class="tag lock">${t('own')}</span>`:''}</td>${FUNCS.map(m=>`<td style="text-align:center"><input type="checkbox" class="fx" data-f="${f.id}" data-m="${m}" data-own="${f.own?1:0}" ${!f.funcs||f.funcs[m]!==false?'checked':''}></td>`).join('')}</tr>`).join('')}</table></div>
 <button class="btn" style="margin-top:12px" onclick="saveFuncs()">${t('save')}</button></div>
 <div class="card"><h2>${t('language')}</h2><div class="row"><button class="btn sm ${lang==='ca'?'':'sec'}" onclick="setLang('ca')">Català</button><button class="btn sm ${lang==='es'?'':'sec'}" onclick="setLang('es')">Castellano</button></div></div>`}
function quickFuncs(m,v){if(!v)return;document.querySelectorAll(`.fx[data-m="${m}"]`).forEach(c=>{const o=c.dataset.own==='1';c.checked=v==='all'||(v==='own'&&o)||(v==='notown'&&!o)})}
async function saveFuncs(){const F2={};document.querySelectorAll('.fx').forEach(c=>{(F2[c.dataset.f]||={})[c.dataset.m]=c.checked});await run(()=>api('farms.funcs',{funcs:F2}),t('saved'));await start()}
async function savePerms(){const p={};ROLES.forEach(r=>p[r]={});document.querySelectorAll('.pm').forEach(s=>p[s.dataset.r][s.dataset.m]=+s.value);document.querySelectorAll('.pf').forEach(c=>p[c.dataset.r][c.dataset.f]=c.checked);
 await run(()=>api('perms.save',{perms:p}),t('saved'));await start()}
function userForm(id){const u=id?B.users.find(x=>x.id===id):{name:'',login:'',role:'granger',farms:[]};const farms=B.allFarms||B.farms;
 modal(`<h2>👤 ${id?t('edit'):t('newUser')}</h2>
 <div class="f"><label class="l">${t('name')} *</label><input id="uName" value="${esc(u.name)}"></div>
 <div class="f"><label class="l">${t('login')} *</label><input id="uLogin" autocapitalize="none" value="${esc(u.login)}"></div>
 <div class="f"><label class="l">${id?t('pinNew'):t('pin')+' *'}</label><input id="uPin" inputmode="numeric" maxlength="8" autocomplete="off"></div>
 <div class="f"><label class="l">${t('role')}</label><select id="uRole">${ROLES.map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${t(r)}</option>`).join('')}</select></div>
 <div class="f"><label class="l">${t('assigned')}</label><div class="muted">${t('assignedHint')}</div>${farms.map(f=>`<label class="chk"><input type="checkbox" class="uF" value="${f.id}" ${u.farms.includes(f.id)?'checked':''}> ${esc(f.name)}</label>`).join('')}</div>
 <div class="err" id="mErr"></div><button class="btn w" onclick="saveUser('${id||''}')">${t('save')}</button>
 <div class="row" style="margin-top:10px;flex-wrap:nowrap"><button class="btn sec grow" onclick="closeModal()">${t('cancel')}</button>${id&&id!==B.me.id?`<button class="btn red grow" onclick="delUser('${id}')">${t('del')}</button>`:''}</div>`)}
async function saveUser(id){const rec={id:id||undefined,name:$('uName').value,login:$('uLogin').value,pin:$('uPin').value,role:$('uRole').value,farms:[...document.querySelectorAll('.uF:checked')].map(c=>c.value)};
 try{await api('users.save',{rec});closeModal();toast(t('saved'));await start()}catch(e){$('mErr').textContent=errMsg(e)}}
async function delUser(id){if(!confirm(t('confirmDel')))return;try{await api('users.delete',{id});closeModal();toast(t('deleted'));await start()}catch(e){$('mErr').textContent=errMsg(e)}}
function pinForm(){modal(`<h2>🔑 ${t('changePin')}</h2><div class="f"><label class="l">${t('oldPin')}</label><input id="pOld" type="password" inputmode="numeric" maxlength="8"></div><div class="f"><label class="l">${t('newPin')}</label><input id="pNew" type="password" inputmode="numeric" maxlength="8"></div><div class="err" id="mErr"></div><button class="btn w" onclick="savePin()">${t('save')}</button><button class="btn sec w" style="margin-top:10px" onclick="closeModal()">${t('cancel')}</button>`)}
async function savePin(){try{await api('pin.change',{old:$('pOld').value,pin:$('pNew').value});closeModal();toast(t('saved'))}catch(e){$('mErr').textContent=errMsg(e)}}

/* ================= INIT ================= */
applyT();
try{$('lUser').value=localStorage.getItem('plug_last')||''}catch(e){}
const SPL0=Date.now();
function hideSplash(){const w=Math.max(0,2800-(Date.now()-SPL0));setTimeout(()=>{const e=$('splash');if(!e)return;e.classList.add('out');setTimeout(()=>e.remove(),650)},w)}
const WANT_INSTALL=/[?&]install=1/.test(location.search)&&!isStandalone();if(WANT_INSTALL)history.replaceState(null,'','/');
(async()=>{if(TOKEN){try{await start();hideSplash();return}catch(e){}}$('login').classList.remove('hidden');hideSplash();if(WANT_INSTALL)setTimeout(()=>shareModal(true),3000)})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
